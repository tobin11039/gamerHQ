<main class="grow w-full px-margin py-lg">
  <div class="max-w-360 mx-auto px-margin py-md space-y-xl">
    <section class="w-full">
      <div class="flex flex-col md:flex-row justify-between items-end md:items-center mb-lg gap-md">
        <div>
          <h1 class="text-display-lg text-on-background">Character Roster</h1>
          <p class="text-body-lg text-on-surface-variant">Showing {{ characters.length }} active champions in your collection.</p>
        </div>
        <div class="flex items-center gap-sm">
          <span class="text-label-md text-outline">Sort by:</span>
          <select class="bg-surface-container-low border-none rounded-lg px-md py-xs text-body-md focus:ring-2 focus:ring-primary transition-all">
            <option>Highest Power</option>
            <option>Recent Level Up</option>
            <option>Name A-Z</option>
            <option>Element Type</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-md">
        @for (character of characters; track character.name) {
          <a [routerLink]="['/characters', character.name]" class="block">
            <app-character-card [character]="character" />
          </a>
        }

        <!-- Add New Card -->
        <button class="flex flex-col items-center justify-center min-h-96 bg-surface-container-low border-2 border-dashed border-outline-variant rounded-xl group hover:border-primary hover:bg-surface-container transition-all">
          <div class="bg-surface-container-lowest w-16 h-16 rounded-full flex items-center justify-center mb-md shadow-sm group-hover:scale-110 transition-transform">
            <span class="material-symbols-outlined text-primary text-[32px]">add</span>
          </div>
          <span class="text-headline-md text-on-surface-variant">Recruit Champion</span>
          <span class="text-body-md text-outline">Unlock from Summoning Circle</span>
        </button>
      </div>
    </section>
  </div>
</main>
